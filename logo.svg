<svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#B9C6D6"/>
      <stop offset="55%" stop-color="#6E7B8C"/>
      <stop offset="100%" stop-color="#E8EEF5"/>
    </linearGradient>
    <linearGradient id="cyanScript" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#00A8FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Faceted diamond mark -->
  <g transform="translate(6,18)">
    <polygon points="22,0 34,10 22,44 10,10" fill="url(#metalFace)" stroke="#00A8FF" stroke-width="1.2" filter="url(#glow)"/>
    <polygon points="10,10 22,0 22,44" fill="#0A0E14" opacity="0.12"/>
    <line x1="10" y1="10" x2="34" y2="10" stroke="#00A8FF" stroke-width="0.6" opacity="0.6"/>
    <line x1="22" y1="0" x2="22" y2="44" stroke="#00A8FF" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- Wordmark -->
  <text x="52" y="42" font-family="'Orbitron', sans-serif" font-weight="800" font-size="26" fill="url(#metalFace)" letter-spacing="1">SETTINGS</text>
  <text x="52" y="64" font-family="'Orbitron', sans-serif" font-weight="600" font-size="20" fill="url(#cyanScript)" letter-spacing="4" filter="url(#glow)">STORE</text>
</svg>
